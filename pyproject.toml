[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-ceiling-index"
version = "0.1.0"
description = "Public-data pipeline measuring ceiling strain among self-serve Shopify merchants ahead of Plus upgrades"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "pydantic>=2",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
    "types-requests",
    "types-tqdm",
]

[project.scripts]
ceiling = "ceiling.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ceiling.db" = ["migrations/*.sql"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Default rules plus import sorting.
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
