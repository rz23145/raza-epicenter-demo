# Workaround app dictionary.
#
# Each entry maps a third-party app to the Plus-native capability it
# substitutes for on a self-serve store. Pattern types: script_host (regex
# against parsed asset host), script_src (regex against full asset URL),
# dom_marker (regex against raw HTML, case-insensitive).
#
# Every entry is verified: false until a human reads both evidence URLs and
# flips it. Entries with empty patterns are candidates awaiting pattern
# discovery; they can never match and exist so the discovery work is visible.
# Patterns marked TODO_VERIFY were written from public knowledge of the app
# and must be confirmed against real storefront source before being trusted.
#
# script_host patterns that would match cdn.shopify.com are rejected at load
# time: that host serves app blocks for thousands of apps and identifies none.

# b2b_wholesale

- app_key: sparklayer
  display_name: SparkLayer
  vendor: SparkLayer Ltd
  capability: b2b_wholesale
  plus_native_equivalent: "Shopify B2B (company profiles, catalogs, net terms) available on Plus"
  plus_native_evidence_url: "https://help.shopify.com/en/manual/b2b"   # TODO_VERIFY exact page
  app_evidence_url: "https://apps.shopify.com/sparklayer"              # TODO_VERIFY
  patterns:
    script_host:
      - "cdn\\.sparklayer\\.io"
      - "sparklayer\\.io"
    dom_marker:
      - "data-sparklayer"
      - "sparklayer-"
  plus_compatible: true
  used_on_plus_commonly: false
  confidence: medium
  verified: false
  notes: "SparkLayer markets to both Plus and non-Plus. On a non-Plus store it substitutes for native B2B."

