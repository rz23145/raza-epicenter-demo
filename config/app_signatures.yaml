# Workaround app dictionary.
#
# Each entry maps a third-party app to the Plus-native capability it
# substitutes for on a self-serve store. Pattern types: script_host (regex
# against parsed asset host), script_src (regex against full asset URL),
# dom_marker (regex against raw HTML, case-insensitive).
#
# Verification round 2026-09-09: every entry marked verified below was
# confirmed by fetching a live storefront's raw HTML (one fetch per domain,
# research UA with contact email) and observing the pattern. The store
# checked and the matched snippet are recorded in notes. Patterns that were
# proposed earlier but affirmatively REFUTED on live stores were removed and
# are named in notes so they do not get reintroduced.
#
# Note on delivery modes: many apps now load via Shopify ScriptTag, which
# embeds the asset URL inside inline JSON with escaped slashes (https:\/\/...).
# Those URLs never appear as <script src> tags, so they must be matched as
# dom_marker, not script_src. Where an app ships as a cdn.shopify.com app
# block, the stable extension PATH is used as script_src; bare-host
# script_host patterns matching cdn.shopify.com are rejected at load time.

# b2b_wholesale

- app_key: sparklayer
  display_name: SparkLayer
  vendor: SparkLayer Ltd
  capability: b2b_wholesale
  plus_native_equivalent: "Shopify B2B (company profiles, catalogs, net terms) available on Plus"
  plus_native_evidence_url: "https://help.shopify.com/en/manual/b2b"   # blocks bots (403); plan gating confirmed at https://shopify.dev/docs/apps/build/b2b, checked 2026-09-09
  app_evidence_url: "https://apps.shopify.com/sparklayer"
  patterns:
    script_host:
      - "cdn\\.sparklayer\\.io"
    dom_marker:
      - "app\\.sparklayer\\.io"
      - "sparkOptions"
  plus_compatible: true
  used_on_plus_commonly: false
  confidence: high
  verified: true
  notes: >
    Verified 2026-09-09 on wholesale.psychi.co.uk: <script async
    src="https://cdn.sparklayer.io/spark-redirect.js">, web-pixel config with
    appDomain app.sparklayer.io, inline window.sparkOptions. Earlier
    candidates data-sparklayer and sparklayer- were NOT present on the live
    page and were removed. sparkcdn.io appears in vendor docs as a newer
    loader but was not seen live, so it is not patterned.

