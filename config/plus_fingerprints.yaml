# Plus fingerprints.
#
# Markers that a store is already on Shopify Plus. Used only for: building
# positive labels, detecting panel conversions, excluding Plus stores from
# the self-serve panel. Never used as features in the ceiling score; a test
# fails if any fingerprint key appears in feature_json.
#
# No public fingerprint is a plan lookup. Each is circumstantial. Every entry
# is verified: false until a human confirms it against Shopify documentation
# and a sample of known Plus stores. Conversion detection in the index uses
# only verified fingerprints, so with zero verified entries the conversion
# series is empty by construction and the README says so.

- fingerprint_key: b2b_native_routes
  display_name: "Native B2B markers"
  evidence_url: "https://shopify.dev/docs/apps/build/b2b"
  # help.shopify.com/en/manual/b2b blocks automated fetches (403, checked
  # 2026-09-09). The shopify.dev page confirms B2B is plan-gated ("Your plan
  # must support B2B capabilities") but does not spell out the tier, so the
  # human owner should still confirm the exact gating in a browser.
  patterns: {}
  confidence: low
  verified: false
  notes: >
    Pattern discovery required: fetch 10 known Plus B2B stores and diff
    against 10 non-Plus stores to find rendered company-location selectors or
    customer.b2b Liquid output. Empty until that work is done.

- fingerprint_key: plus_only_app_script
  display_name: "Script host of a Plus-gated app (Launchpad primary candidate)"
  evidence_url: "https://apps.shopify.com/launchpad"
  patterns: {}
  confidence: low
  verified: false
  notes: >
    Checked 2026-09-09. The Launchpad app store listing states "Note: Only
    available to Shopify Plus customers", so the gate is confirmed, but
    Launchpad runs inside the admin and injects no storefront script, so
    there is nothing to pattern on from public HTML. Patterns stay empty.
    help.shopify.com blocks automated fetches (403), which is why the
    evidence URL points at the app listing instead. Related fact recorded
    the same day: Shopify Scripts ceased executing 2026-06-30 and custom-app
    Shopify Functions remain Plus-gated
    (https://shopify.dev/docs/apps/build/functions/migrating-from-shopify-scripts).

- fingerprint_key: multipass_login
  display_name: "Multipass login route"
  evidence_url: "https://shopify.dev/docs/api/multipass"
  patterns:
    dom_marker:
      - "/account/login/multipass"
  confidence: high
  verified: true
  notes: >
    Verified 2026-09-09. shopify.dev/docs/api/multipass Requirements section
    states: "Your store must be on a Shopify Plus plan." Live confirmation:
    brooklinen.com homepage HTML contains
    'https://www.brooklinen.com/account/login/multipass/' + multipass_token.
    Caveat: Multipass now works only with legacy customer accounts, so
    absence of this marker is not evidence of non-Plus. Presence remains a
    strong Plus indicator.

- fingerprint_key: shopify_plus_text
  display_name: "Literal 'Shopify Plus' text"
  evidence_url: ""
  patterns:
    dom_marker:
      - "shopify\\s+plus"
  confidence: low
  verified: false
  notes: >
    Many false positives: agency badges, blog posts, theme credits. Never use
    alone for labeling. Kept because it is cheap corroboration. Sensitivity
    sample 2026-09-09: 0 of 8 likely-Plus storefront homepages (gymshark,
    fashionnova, kyliecosmetics, colourpop, allbirds, brooklinen, ruggable,
    deathwishcoffee) contained the literal text, so recall on homepages is
    near zero. False positive rate on confirmed negatives still unmeasured,
    so verified stays false.

- fingerprint_key: expansion_store_hreflang
  display_name: "hreflang alternates to sibling storefronts on other domains"
  evidence_url: "https://help.shopify.com/en/manual/markets"           # TODO_VERIFY expansion store docs
  patterns: {}
  confidence: medium
  verified: false
  notes: >
    Computed from extracted hreflang alternates: two or more alternates on
    external hosts. Also produced by non-Plus merchants running two separate
    plans, which is documented and why this stays unverified by default.

- fingerprint_key: checkout_branding_markers
  display_name: "Checkout branding markers"
  evidence_url: ""                                                     # TODO_VERIFY
  patterns: {}
  confidence: low
  verified: false
  notes: >
    To be discovered empirically. Probably not observable without a checkout
    page, which this pipeline does not fetch. Kept so the gap is explicit.
